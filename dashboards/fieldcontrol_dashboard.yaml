# ==============================================================================
# FIELDCONTROL - DASHBOARD LOVELACE HOME ASSISTANT
# Estética moderna Glassmorphism basada en la WebApp oficial de FieldControl.
# ==============================================================================
# Instrucciones de uso:
# 1. En Home Assistant, ve a Ajustes -> Cuadros de mando (Dashboards).
# 2. Crea un nuevo cuadro de mando en modo YAML o en blanco.
# 3. Abre el editor de código YAML y pega el siguiente contenido.
# ==============================================================================

title: FieldControl
views:
  - title: Panel Principal
    icon: mdi:sprinkler-variant
    badges:
      - entity: binary_sensor.fieldcontrol_online
        name: Estado
      - type: entity
        entity: binary_sensor.fieldcontrol_sensor_de_lluvia
        name: Sensor Lluvia
      - entity: sensor.fieldcontrol_senal_wi_fi
        name: Señal Wi-Fi
    cards:
      - type: markdown
        content: >
          <img
          src="https://raw.githubusercontent.com/FieldControl-Irrigation/FieldControl-Home-Assistant/main/custom_components/fieldcontrol/brand/logo_b.png"
          style="width: 60px; height: auto;" />


          **Estado:** {{ 'ONLINE 🟢' if
          is_state('binary_sensor.fieldcontrol_online', 'on') else 'OFFLINE 🔴'
          }} | **ID:** `{{ states('sensor.fieldcontrol_device_id') }}`

          **Válvula Activa:** {{ states('sensor.fieldcontrol_valvula_activa')
          }} 

          {% if is_state('binary_sensor.fieldcontrol_riego_activo', 'on') %}

          ⏳ **Tiempo Restante:** {{
          states('sensor.fieldcontrol_tiempo_restante') }} segundos

          {% endif %}
      - type: horizontal-stack
        cards:
          - type: tile
            entity: switch.fieldcontrol_modo_automatico
            name: Modo Auto
            icon: mdi:play
            color: amber
            tap_action:
              action: toggle
          - type: tile
            entity: switch.fieldcontrol_rele_accesorio
            name: Bomba de pileta
            icon: mdi:lightning-bolt-circle
            color: blue
            tap_action:
              action: toggle
      - show_name: true
        show_icon: true
        type: button
        name: STOP
        icon: mdi:stop-circle
        tap_action:
          action: call-service
          service: fieldcontrol.stop_all
        hold_action:
          action: none
        theme: dark
        color: red
        icon_height: 70px
      - type: vertical-stack
        cards:
          - type: markdown
            content: '### Zonas de riego 💧 10min'
          - type: grid
            square: false
            columns: 2
            cards:
              - show_name: true
                show_icon: true
                type: button
                name: Válvula 1
                icon: mdi:sprinkler-variant
                tap_action:
                  action: call-service
                  service: fieldcontrol.start_valve
                  target: {}
                  data:
                    valve: 0
                    minutes: 10
                show_state: true
                color: green
                icon_height: 50px
              - show_name: true
                show_icon: true
                type: button
                name: Válvula 2
                icon: mdi:sprinkler-variant
                tap_action:
                  action: call-service
                  service: fieldcontrol.start_valve
                  target: {}
                  data:
                    valve: 1
                    minutes: 10
                show_state: true
                color: green
                icon_height: 50px
